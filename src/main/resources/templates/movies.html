<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movies | Movie Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .genre-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            padding-bottom: 0.25rem;
        }
        .genre-scroll .chip-row {
            flex-wrap: nowrap;
            width: max-content;
            min-width: 100%;
        }
        .genre-chip {
            border-radius: 999px;
            padding: 0.45rem 1rem;
            font-size: 0.9rem;
            white-space: nowrap;
            text-decoration: none;
            border: none;
            transition: background-color .15s ease, color .15s ease;
        }
        .genre-chip-inactive {
            background-color: #2d2d2d;
            color: #f8f9fa;
        }
        .genre-chip-inactive:hover {
            background-color: #3d3d3d;
            color: #fff;
        }
        .genre-chip-active {
            background-color: #fff;
            color: #111;
        }
        .movie-card {
            background-color: #1a1a1a;
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        .movie-card .card-img-top {
            border-radius: 12px 12px 0 0;
        }
        .genre-section-label {
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg border-bottom border-secondary" style="background-color: #111;">
    <div class="container">
        <a class="navbar-brand fw-bold text-light" href="/movies">Movie Platform</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/bookings">My Bookings</a>
            <a class="btn btn-outline-light btn-sm" href="/profile">Profile</a>
            <a class="btn btn-light btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-0">Discover Movies</h1>
            <p class="text-secondary mb-0" th:text="'Welcome, ' + ${userName}"></p>
        </div>
        <form class="d-flex gap-2" method="get" action="/movies">
            <input type="hidden" name="type" th:value="${selectedType}" th:if="${selectedType != null and selectedType != 'Trending'}"/>
            <input class="form-control bg-dark text-light border-secondary" name="q" th:value="${query}" placeholder="Search by title or genre">
            <button type="submit" class="btn btn-light">Search</button>
        </form>
    </div>

    <p class="genre-section-label text-secondary text-uppercase small fw-semibold mb-2">Movies by genre</p>
    <div class="genre-scroll mb-4">
        <div class="d-flex gap-2 chip-row">
            <th:block th:each="ft : ${filterTypes}">
                <a th:if="${ft == 'Trending'}"
                   th:href="@{/movies(q=${query})}"
                   th:class="${ft == selectedType} ? 'genre-chip genre-chip-active' : 'genre-chip genre-chip-inactive'"
                   th:text="${ft}">Trending</a>
                <a th:if="${ft != 'Trending'}"
                   th:href="@{/movies(q=${query},type=${ft})}"
                   th:class="${ft == selectedType} ? 'genre-chip genre-chip-active' : 'genre-chip genre-chip-inactive'"
                   th:text="${ft}">Action</a>
            </th:block>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="movie : ${movies}">
            <div class="card movie-card h-100 shadow-sm">
                <img th:src="${movie.imageUrl}" class="card-img-top" style="height:220px; object-fit:cover;" alt="poster">
                <div class="card-body d-flex flex-column text-light">
                    <h5 class="card-title" th:text="${movie.title}"></h5>
                    <p class="text-secondary small mb-2" th:text="${movie.genre + ' • ' + movie.duration}"></p>
                    <p class="card-text small text-secondary" th:text="${movie.description}"></p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fw-semibold" th:text="'LKR ' + ${movie.normalPrice}"></span>
                        <a class="btn btn-light btn-sm" th:href="@{'/movies/' + ${movie.movieId}}">View Details</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(movies)}">
            <div class="alert alert-secondary bg-secondary bg-opacity-25 border-secondary text-light">No movies found for your search.</div>
        </div>
    </div>
</div>
</body>
</html>
