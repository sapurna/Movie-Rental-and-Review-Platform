<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Movie Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="profile-page-bg">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/movies">Movie Platform</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-dark btn-sm" href="/movies">Movies</a>
            <a class="btn btn-outline-dark btn-sm" href="/bookings">My Bookings</a>
            <a class="btn btn-dark btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="profile-card shadow">
                <div class="profile-card-hero">
                    <h1 class="profile-card-hero-title">User Profile</h1>
                </div>
                <div class="profile-avatar-wrap">
                    <img class="profile-avatar" th:src="@{/posters/profile_pic.png}" alt="Profile picture" width="160" height="160">
                    <button type="button" class="profile-cam-btn" aria-label="Change profile photo" title="Photo upload is not available" disabled>
                        <i class="fa-solid fa-camera fa-xs"></i>
                    </button>
                </div>
                <div class="profile-card-body">
                    <div th:if="${message}" class="alert alert-info py-2 small" th:text="${message}"></div>

                    <form method="post" th:action="@{/profile/update}" class="profile-form">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <div class="profile-field-box">
                                    <div class="profile-field-row">
                                        <span class="profile-field-label">Full Name:</span>
                                        <input class="profile-field-input" name="fullName" th:value="${user.fullName}" required autocomplete="name">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="profile-field-box">
                                    <div class="profile-field-row">
                                        <span class="profile-field-label">Email:</span>
                                        <span class="profile-field-static" th:text="${user.email}">email</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="profile-field-box">
                                    <div class="profile-field-row">
                                        <span class="profile-field-label">Total Booked Tickets:</span>
                                        <span class="profile-field-static" th:text="${totalBookedTickets}">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="profile-field-box">
                                    <div class="profile-field-row">
                                        <span class="profile-field-label">Contact:</span>
                                        <input class="profile-field-input" name="phone" th:value="${user.phone != null ? user.phone : ''}" placeholder="—" autocomplete="tel">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-outline-dark btn-sm px-4">Save profile changes</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <button type="button" class="profile-gradient-btn" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                            Change Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Change Password modal -->
<div class="modal fade pwd-change-modal" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content pwd-modal-shell border-0">
            <button type="button" class="btn-close pwd-modal-dismiss" data-bs-dismiss="modal" aria-label="Close"></button>
            <div class="modal-body pwd-modal-body">
                <div class="text-center mb-2">
                    <span class="pwd-modal-lock"><i class="fa-solid fa-lock" aria-hidden="true"></i></span>
                </div>
                <h2 class="pwd-modal-title h5 text-center fw-bold mb-3" id="changePasswordModalLabel">Change Password</h2>

                <div th:if="${passwordError}" class="alert alert-danger py-2 small mb-3" th:text="${passwordError}"></div>

                <form method="post" th:action="@{/profile/change-password}" id="changePasswordForm">
                    <input type="password" name="oldPassword" class="form-control pwd-modal-input mb-2" placeholder="Old Password" required autocomplete="current-password">
                    <input type="password" name="newPassword" class="form-control pwd-modal-input mb-2" placeholder="New Password" required minlength="4" autocomplete="new-password">
                    <input type="password" name="confirmPassword" class="form-control pwd-modal-input mb-3" placeholder="Confirm New Password" required minlength="4" autocomplete="new-password">
                    <button type="submit" class="btn pwd-modal-submit w-100">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:if="${openPasswordModal}">
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const el = document.getElementById("changePasswordModal");
        if (el && typeof bootstrap !== "undefined") {
            new bootstrap.Modal(el).show();
        }
    });
</script>
</th:block>
</body>
</html>
