<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Movie Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/movies">Movie Platform</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-dark btn-sm" href="/movies">Movies</a>
            <a class="btn btn-outline-dark btn-sm" href="/bookings">My Bookings</a>
            <a class="btn btn-dark btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h4 mb-3">My Profile</h2>
                    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
                    <form method="post" action="/profile/update">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input class="form-control" name="fullName" th:value="${user.fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input class="form-control" th:value="${user.email}" readonly>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Phone</label>
                            <input class="form-control" name="phone" th:value="${user.phone}">
                        </div>
                        <button class="btn btn-dark" type="submit">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
