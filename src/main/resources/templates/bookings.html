<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bookings | Movie Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/movies">Movie Platform</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-dark btn-sm" href="/movies">Movies</a>
            <a class="btn btn-outline-dark btn-sm" href="/profile">Profile</a>
            <a class="btn btn-dark btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <h1 class="h3 fw-bold">My Bookings</h1>
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
    <div class="card border-0 shadow-sm">
        <div class="card-body table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>Movie ID</th>
                    <th>Seat No</th>
                    <th>Type</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.bookingId}"></td>
                    <td th:text="${b.movieId}"></td>
                    <td>
                        <form class="d-flex gap-2" method="post" action="/bookings/update">
                            <input type="hidden" name="bookingId" th:value="${b.bookingId}">
                            <input class="form-control form-control-sm" name="seatNumber" th:value="${b.seatNumber}" required>
                            <button class="btn btn-sm btn-outline-primary">Save</button>
                        </form>
                    </td>
                    <td th:text="${b.seatType}"></td>
                    <td th:text="'LKR ' + ${b.price}"></td>
                    <td><span class="badge text-bg-secondary" th:text="${b.status}"></span></td>
                    <td class="d-flex gap-1">
                        <form method="post" action="/bookings/confirm">
                            <input type="hidden" name="bookingId" th:value="${b.bookingId}">
                            <button class="btn btn-sm btn-success">Confirm</button>
                        </form>
                        <form method="post" action="/bookings/delete">
                            <input type="hidden" name="bookingId" th:value="${b.bookingId}">
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="7" class="text-center text-muted py-4">No bookings yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
