<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movies | Movie Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/movies">Movie Platform</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-dark btn-sm" href="/bookings">My Bookings</a>
            <a class="btn btn-outline-dark btn-sm" href="/profile">Profile</a>
            <a class="btn btn-dark btn-sm" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 fw-bold mb-0">Discover Movies</h1>
            <p class="text-muted mb-0" th:text="'Welcome, ' + ${userName}"></p>
        </div>
        <form class="d-flex gap-2" method="get" action="/movies">
            <input class="form-control" name="q" th:value="${query}" placeholder="Search by title or genre">
            <button class="btn btn-dark">Search</button>
        </form>
    </div>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="movie : ${movies}">
            <div class="card h-100 border-0 shadow-sm">
                <img th:src="${movie.imageUrl}" class="card-img-top" style="height:220px; object-fit:cover;" alt="poster">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${movie.title}"></h5>
                    <p class="text-muted small mb-2" th:text="${movie.genre + ' • ' + movie.duration}"></p>
                    <p class="card-text small" th:text="${movie.description}"></p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fw-semibold" th:text="'LKR ' + ${movie.normalPrice}"></span>
                        <a class="btn btn-dark btn-sm" th:href="@{'/movies/' + ${movie.movieId}}">View Details</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(movies)}">
            <div class="alert alert-secondary">No movies found for your search.</div>
        </div>
    </div>
</div>
</body>
</html>
